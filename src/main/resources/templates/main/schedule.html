<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Watering Schedule</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }
        .plant-card {
            transition: all 0.3s ease;
        }
        .plant-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .moisture-indicator {
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(90deg, #ff6b6b 0%, #feca57 50%, #54a0ff 100%);
        }
        .moisture-level {
            height: 100%;
            border-radius: 4px;
            background-color: #38b2ac;
            transition: width 0.5s ease;
        }
        .status-badge {
            border-radius: 9999px;
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-optimal {
            background-color: #c6f6d5;
            color: #22543d;
        }
        .status-warning {
            background-color: #feebc8;
            color: #7b341e;
        }
        .status-critical {
            background-color: #fed7d7;
            color: #822727;
        }
    </style>
</head>
<body>

<div layout:fragment="content">
    <main class="container mx-auto px-4 py-8">
        <div class="flex flex-col md:flex-row gap-8">
            <!-- Calendar column -->
            <div class="md:w-2/3">
                <div class="bg-white rounded-xl shadow-md p-6">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-6">Watering Calendar</h2>
                    <!-- Calendar Legend -->
                    <div class="flex items-center space-x-4 mb-2">
                        <div class="flex items-center"><span class="w-3 h-3 bg-green-500 rounded-full mr-2"></span>Indoor Plants</div>
                        <div class="flex items-center"><span class="w-3 h-3 bg-blue-500 rounded-full mr-2"></span>Outdoor Plants</div>
                        <div class="flex items-center"><span class="w-3 h-3 bg-orange-500 rounded-full mr-2"></span>Herbs</div>
                    </div>
                    <div id="calendar" class="grid grid-cols-7 gap-2 text-sm text-center">
                        <script>
                            const scheduledDates = [
                                { date: '2025-06-03', type: 'Indoor' },
                                { date: '2025-06-05', type: 'Outdoor' },
                                { date: '2025-06-15', type: 'Herb' },
                                { date: '2025-06-22', type: 'Indoor' }, // today
                            ];

                            const today = new Date().toISOString().split('T')[0];
                            const calendar = document.getElementById("calendar");

                            const getTypeColor = (type) => {
                                switch (type) {
                                    case 'Indoor': return 'bg-green-200';
                                    case 'Outdoor': return 'bg-blue-200';
                                    case 'Herb': return 'bg-orange-200';
                                    default: return 'bg-gray-200';
                                }
                            };

                            // Generate calendar for June 2025
                            const daysInMonth = 30;
                            const startDay = new Date('2025-06-01').getDay(); // 0 = Sunday
                            for (let i = 0; i < startDay; i++) {
                                calendar.innerHTML += `<div class="h-12"></div>`; // empty start padding
                            }

                            for (let day = 1; day <= daysInMonth; day++) {
                                const fullDate = `2025-06-${String(day).padStart(2, '0')}`;
                                const schedule = scheduledDates.find(d => d.date === fullDate);

                                calendar.innerHTML += `
                                        <div class="h-12 flex items-center justify-center rounded-lg
                                            ${schedule ? getTypeColor(schedule.type) : 'hover:bg-gray-100'}
                                            ${fullDate === today ? 'ring ring-green-400' : ''}">
                                            ${day}
                                        </div>`;
                            }

                            // Handle today's schedule display
                            const todayEntry = scheduledDates.find(d => d.date === today);
                            const todayDiv = document.getElementById("todaySchedule");
                            if (todayEntry) {
                                todayDiv.innerHTML = `
                                        <div class="text-emerald-600 font-semibold text-sm">✓ Watering scheduled for today</div>
                                        <div class="text-gray-500 text-sm mt-1">${todayEntry.type} plant</div>`;
                            }
                        </script>
                    </div>
                </div>

                <!-- Today's Schedule -->
                <div class="bg-white rounded-xl shadow-md p-6 mt-6">
                    <h2 class="text-xl font-semibold text-gray-800 mb-4">Today's Watering Schedule</h2>
                    <div class="space-y-4">
                        <div th:each="schedule : ${schedules}"
                             th:if="${schedule.scheduleDate != null and schedule.scheduleDate.equals(T(java.time.LocalDate).now())}">
                            <div class="p-4 bg-emerald-50 rounded-lg shadow flex justify-between items-center">
                                <div>
                                    <p class="text-gray-800 font-medium" th:text="${schedule.plant.name}">Plant Name</p>
                                    <p class="text-gray-500 text-sm"
                                       th:text="${#temporals.format(schedule.scheduleTime.toLocalDateTime(), 'hh:mm a')}">08:00 AM</p>
                                </div>
                                <form th:action="@{/schedule/complete/{id}(id=${schedule.id})}" method="post">
                                    <button type="submit" class="hover:text-green-600 text-gray-400">
                                        <i class="fas fa-check-circle text-xl"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                        <div id="todaySchedule" class="text-center text-gray-500">
                            <i class="fas fa-calendar-times text-3xl mb-2 text-gray-400"></i><br>
                            No watering scheduled for today
                        </div>
                    </div>
                </div>
            </div>

            <!-- Plant List -->
            <div class="md:w-1/3">
                <div class="bg-white rounded-xl shadow-md p-6">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-4">My Plants</h2>
                    <div class="space-y-4">
                        <div th:each="plant : ${plants}" class="border p-4 rounded-lg flex items-center"
                             th:classappend="${plant.wateringFrequency != null and plant.lastWatered != null and T(java.time.LocalDate).now().minusDays(plant.wateringFrequency).isAfter(plant.lastWatered)} ? 'bg-red-50 border-red-300' : 'border-gray-200'">
                            <div class="w-12 h-12 rounded-full bg-emerald-200 flex items-center justify-center mr-4">
                                <i class="fas fa-leaf text-white text-xl"></i>
                            </div>
                            <div class="flex-grow">
                                <h3 class="font-medium text-gray-800" th:text="${plant.name}">Plant Name</h3>
                                <div class="text-sm text-gray-500">
                                    <span th:if="${plant.wateringFrequency != null and plant.lastWatered != null and T(java.time.LocalDate).now().minusDays(plant.wateringFrequency).isAfter(plant.lastWatered)}">Needs water now!</span>
                                    <span th:if="${plant.wateringFrequency != null and plant.lastWatered != null and not T(java.time.LocalDate).now().minusDays(plant.wateringFrequency).isAfter(plant.lastWatered)}"
                                          th:text="'Water in ' + ${plant.wateringFrequency - T(java.time.temporal.ChronoUnit).DAYS.between(plant.lastWatered, T(java.time.LocalDate).now())} + ' days'">
                                    </span>
                                </div>
                                <div class="mt-2">
                                    <div class="text-xs text-gray-500 flex justify-between mb-1">
                                        <span>Moisture</span>
                                        <span th:text="${plant.minOptimalMoisture + '-' + plant.maxOptimalMoisture + '%'}">60%</span>
                                    </div>
                                    <div class="w-full h-2 bg-gray-200 rounded-full">
                                        <div class="h-2 bg-emerald-500 rounded-full" th:style="'width: ' + ${plant.minOptimalMoisture + '-' + plant.maxOptimalMoisture + '%'}"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
