<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Sensor Data</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }
        .moisture-indicator {
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(90deg, #ff6b6b 0%, #feca57 50%, #54a0ff 100%);
            overflow: hidden;
        }
        .moisture-level {
            height: 100%;
            border-radius: 4px;
            background-color: #38b2ac;
        }
        .status-badge {
            border-radius: 9999px;
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-optimal { background-color: #c6f6d5; color: #22543d; }
        .status-warning { background-color: #feebc8; color: #7b341e; }
        .status-critical { background-color: #fed7d7; color: #822727; }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="max-w-7xl mx-auto py-2" data-autorefresh="30">

        <!-- Controls -->
        <div class="flex flex-wrap items-center justify-between gap-3 mb-6" th:if="${selectedPlant != null}">
            <div>
                <h1 class="text-2xl font-semibold text-gray-800">Sensor Data</h1>
                <p class="text-sm text-gray-500">
                    <span th:text="${totalReadings}">0</span> readings in the last
                    <span th:text="${range}">24h</span> &middot; refreshes every 30s
                </p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <form th:action="@{/sensor}" method="get" class="flex items-center gap-2">
                    <input type="hidden" name="range" th:value="${range}">
                    <label for="plantSelect" class="text-sm text-gray-600">Plant</label>
                    <select id="plantSelect" name="plantId" onchange="this.form.submit()"
                            class="border rounded-md px-3 py-2 bg-white text-sm">
                        <option th:each="p : ${plants}" th:value="${p.id}" th:text="${p.name}"
                                th:selected="${p.id == selectedPlant.id}"></option>
                    </select>
                </form>
                <div class="flex space-x-2">
                    <a th:each="r : ${T(java.util.List).of('24h','7d','30d')}"
                       th:href="@{/sensor(plantId=${selectedPlant.id}, range=${r})}"
                       th:text="${r}"
                       th:classappend="${r == range} ? 'bg-indigo-100 text-indigo-700' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'"
                       class="px-3 py-1 rounded-md text-sm font-medium">24h</a>
                </div>
            </div>
        </div>

        <div class="bg-white shadow rounded-lg p-6 text-center text-gray-500" th:if="${selectedPlant == null}">
            No plants yet. <a th:href="@{/plant/new}" class="text-indigo-600 underline">Add one</a> to see sensor data.
        </div>

        <th:block th:if="${selectedPlant != null}">
            <div class="bg-white shadow rounded-lg p-6 text-center text-gray-500 mb-8" th:if="${#lists.isEmpty(chartData)}">
                No sensor readings in this period for <span th:text="${selectedPlant.name}">plant</span>.
            </div>

            <!-- Charts -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8" th:unless="${#lists.isEmpty(chartData)}">
                <div class="bg-white p-4 rounded-lg shadow-md">
                    <h3 class="text-lg font-medium text-gray-800 mb-1">Soil Moisture</h3>
                    <p class="text-xs text-gray-500 mb-3"
                       th:text="'Optimal ' + ${selectedPlant.minOptimalMoisture} + '-' + ${selectedPlant.maxOptimalMoisture} + '%'"></p>
                    <div class="h-56"><canvas id="moisture-chart"></canvas></div>
                </div>
                <div class="bg-white p-4 rounded-lg shadow-md">
                    <h3 class="text-lg font-medium text-gray-800 mb-1">Temperature</h3>
                    <p class="text-xs text-gray-500 mb-3"
                       th:text="'Optimal ' + ${selectedPlant.minOptimalTemperature} + '-' + ${selectedPlant.maxOptimalTemperature} + '°C'"></p>
                    <div class="h-56"><canvas id="temperature-chart"></canvas></div>
                </div>
                <div class="bg-white p-4 rounded-lg shadow-md">
                    <h3 class="text-lg font-medium text-gray-800 mb-1">Humidity</h3>
                    <p class="text-xs text-gray-500 mb-3"
                       th:text="'Optimal ' + ${selectedPlant.minOptimalHumidity} + '-' + ${selectedPlant.maxOptimalHumidity} + '%'"></p>
                    <div class="h-56"><canvas id="humidity-chart"></canvas></div>
                </div>
            </div>

            <!-- Table -->
            <div class="bg-white p-4 rounded-lg shadow-md overflow-x-auto">
                <h3 class="text-lg font-medium text-gray-800 mb-4">
                    Recent Sensor Records
                    <span class="text-sm font-normal text-gray-500" th:if="${totalReadings > #lists.size(sensors)}"
                          th:text="'(latest ' + ${#lists.size(sensors)} + ' of ' + ${totalReadings} + ')'"></span>
                </h3>
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Timestamp</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Plant</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Moisture</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Temp</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Humidity</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                    </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="sensor : ${sensors}">
                        <td class="px-6 py-4 text-sm text-gray-500"
                            th:text="${#dates.format(sensor.recordedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                        <td class="px-6 py-4 text-sm text-gray-700" th:text="${selectedPlant.name}"></td>
                        <td class="px-6 py-4">
                            <div class="w-32 moisture-indicator">
                                <div class="moisture-level" th:style="'width:' + ${sensor.soilMoisture} + '%'"></div>
                            </div>
                            <div class="text-xs text-gray-500 mt-1" th:text="${#numbers.formatDecimal(sensor.soilMoisture, 1, 1) + '%'}"></div>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-500" th:text="${#numbers.formatDecimal(sensor.temperature, 1, 1) + '°C'}"></td>
                        <td class="px-6 py-4 text-sm text-gray-500" th:text="${#numbers.formatDecimal(sensor.humidity, 1, 1) + '%'}"></td>
                        <td class="px-6 py-4">
                            <span th:with="st=${statuses.get(sensor.id)}" th:text="${st}"
                                  th:class="'status-badge ' + (${st} == 'Critical' ? 'status-critical' : (${st} == 'Warning' ? 'status-warning' : 'status-optimal'))"></span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(sensors)}">
                        <td colspan="6" class="px-6 py-4 text-center text-sm text-gray-500">No readings yet.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </th:block>
    </div>

    <script th:if="${selectedPlant != null and !#lists.isEmpty(chartData)}" th:inline="javascript">
        /*<![CDATA[*/
        const sensorData = /*[[${chartData}]]*/ [];
        const minMoisture = /*[[${selectedPlant.minOptimalMoisture}]]*/ 0;
        const maxMoisture = /*[[${selectedPlant.maxOptimalMoisture}]]*/ 100;
        const minTemperature = /*[[${selectedPlant.minOptimalTemperature}]]*/ 0;
        const maxTemperature = /*[[${selectedPlant.maxOptimalTemperature}]]*/ 40;
        const minHumidity = /*[[${selectedPlant.minOptimalHumidity}]]*/ 0;
        const maxHumidity = /*[[${selectedPlant.maxOptimalHumidity}]]*/ 100;
        const bounds = {
            moisture: [minMoisture, maxMoisture],
            temperature: [minTemperature, maxTemperature],
            humidity: [minHumidity, maxHumidity]
        };
        const labels = sensorData.map(d => new Date(d.t).toLocaleString([], {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'}));

        function drawChart(canvasId, key, label, color, unit) {
            const flat = v => Array(labels.length).fill(v);
            new Chart(document.getElementById(canvasId).getContext('2d'), {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        {label: label, data: sensorData.map(d => d[key]), borderColor: color,
                         backgroundColor: color, tension: 0.3, pointRadius: 2, borderWidth: 2},
                        {label: 'Min', data: flat(bounds[key][0]), borderColor: '#f59e0b',
                         borderDash: [5, 5], pointRadius: 0, borderWidth: 1},
                        {label: 'Max', data: flat(bounds[key][1]), borderColor: '#8b5cf6',
                         borderDash: [5, 5], pointRadius: 0, borderWidth: 1}
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    interaction: {mode: 'index', intersect: false},
                    plugins: {
                        legend: {position: 'bottom', labels: {boxWidth: 12}},
                        tooltip: {callbacks: {label: c => c.dataset.label + ': ' + c.formattedValue + unit}}
                    },
                    scales: {x: {ticks: {maxTicksLimit: 5, maxRotation: 0}}}
                }
            });
        }
        drawChart('moisture-chart', 'moisture', 'Soil moisture', '#14b8a6', '%');
        drawChart('temperature-chart', 'temperature', 'Temperature', '#ef4444', '°C');
        drawChart('humidity-chart', 'humidity', 'Humidity', '#3b82f6', '%');
        /*]]>*/
    </script>
</div>
</body>
</html>
