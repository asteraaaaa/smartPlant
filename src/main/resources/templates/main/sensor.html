<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Sensor Data</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }
        .plant-card {
            transition: all 0.3s ease;
        }
        .plant-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .moisture-indicator {
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(90deg, #ff6b6b 0%, #feca57 50%, #54a0ff 100%);
        }
        .moisture-level {
            height: 100%;
            border-radius: 4px;
            background-color: #38b2ac;
            transition: width 0.5s ease;
        }
        .status-badge {
            border-radius: 9999px;
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-optimal {
            background-color: #c6f6d5;
            color: #22543d;
        }
        .status-warning {
            background-color: #feebc8;
            color: #7b341e;
        }
        .status-critical {
            background-color: #fed7d7;
            color: #822727;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <main class="flex-grow container mx-auto px-4 py-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="plant-card bg-white p-4 rounded-lg shadow-md">
                <h3 class="text-lg font-medium text-gray-800 mb-4">Soil Moisture</h3>
                <canvas id="moisture-chart"></canvas>
            </div>
            <div class="plant-card bg-white p-4 rounded-lg shadow-md">
                <h3 class="text-lg font-medium text-gray-800 mb-4">Temperature</h3>
                <canvas id="temperature-chart"></canvas>
            </div>
            <div class="plant-card bg-white p-4 rounded-lg shadow-md">
                <h3 class="text-lg font-medium text-gray-800 mb-4">Humidity</h3>
                <canvas id="humidity-chart"></canvas>
            </div>
            <div class="plant-card bg-white p-4 rounded-lg shadow-md">
                <h3 class="text-lg font-medium text-gray-800 mb-4">Light Level</h3>
                <canvas id="light-chart"></canvas>
            </div>
        </div>

        <div class="bg-white p-4 rounded-lg shadow-md">
            <h3 class="text-lg font-medium text-gray-800 mb-4">Recent Sensor Records</h3>
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Timestamp</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Plant</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Moisture</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Temp</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Humidity</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                <tr th:each="sensor : ${sensors}">
                    <td class="px-6 py-4 text-sm text-gray-500"
                        th:text="${#dates.format(sensor.recordedAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td class="px-6 py-4 text-sm text-gray-700" th:text="${sensor.plant.name}"></td>
                    <td class="px-6 py-4">
                        <div class="w-32 moisture-indicator">
                            <div class="moisture-level" th:style="'width:' + sensor.soilMoisture + '%'"></div>
                        </div>
                        <div class="text-xs text-gray-500 mt-1" th:text="${sensor.soilMoisture + '%'}"></div>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-500" th:text="${sensor.temperature + '°C'}"></td>
                    <td class="px-6 py-4 text-sm text-gray-500" th:text="${sensor.humidity + '%'}"></td>
                    <td class="px-6 py-4">
                        <span th:if="${sensor.soilMoisture >= 60}" class="status-badge status-optimal">Optimal</span>
                        <span th:if="${sensor.soilMoisture >= 35 and sensor.soilMoisture < 60}" class="status-badge status-warning">Warning</span>
                        <span th:if="${sensor.soilMoisture < 35}" class="status-badge status-critical">Critical</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
