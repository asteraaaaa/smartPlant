<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <title>System Logs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div layout:fragment="content">
  <div class="max-w-5xl mx-auto py-6 px-4">
    <h1 class="text-2xl font-semibold text-gray-800 mb-6">System Logs</h1>
    <div class="bg-white shadow rounded-lg overflow-hidden">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Time</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Type</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Description</th>
        </tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
        <tr th:each="log : ${logs}">
          <td class="px-6 py-3 text-sm text-gray-500 whitespace-nowrap"
              th:text="${#dates.format(log.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
          <td class="px-6 py-3 text-sm">
            <span class="px-2 py-1 rounded-full text-xs font-semibold"
                  th:classappend="${log.eventType == 'WARNING'} ? 'bg-red-100 text-red-800' :
                                  (${log.eventType == 'PUMP'} ? 'bg-blue-100 text-blue-800' : 'bg-gray-100 text-gray-700')"
                  th:text="${log.eventType}"></span>
          </td>
          <td class="px-6 py-3 text-sm text-gray-700" th:text="${log.description}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(logs)}">
          <td colspan="3" class="px-6 py-6 text-center text-sm text-gray-500">No events yet.</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
