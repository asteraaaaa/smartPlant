<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <title>Plants</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .status-badge { border-radius: 9999px; padding: 0.25rem 0.75rem; font-size: 0.75rem; font-weight: 600; }
    .status-optimal { background-color: #c6f6d5; color: #22543d; }
    .status-warning { background-color: #feebc8; color: #7b341e; }
    .status-critical { background-color: #fed7d7; color: #822727; }
    .status-nodata { background-color: #e2e8f0; color: #4a5568; }
    .plant-card { transition: all 0.3s ease; }
    .plant-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,.1); }
  </style>
</head>

<body>
<div layout:fragment="content">
  <div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">

    <div th:replace="~{fragment/flash :: flash}"></div>

    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-semibold text-gray-800">Plant Profiles</h1>
      <a th:href="@{/plant/new}" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md">
        + Add New Plant
      </a>
    </div>

    <div th:if="${#lists.isEmpty(plants)}" class="bg-white shadow rounded-lg p-8 text-center text-gray-500">
      No plants yet. Add your first plant to start monitoring.
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div th:each="plant : ${plants}" class="plant-card bg-white overflow-hidden shadow rounded-lg">
        <div class="px-4 pt-5 pb-4">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-lg font-medium text-gray-900" th:text="${plant.name}">Plant Name</h3>
              <p class="text-sm text-gray-500" th:text="${plant.type}">Type</p>
            </div>
            <span th:text="${plant.status}"
                  th:class="'status-badge ' + (${plant.status} == 'Critical' ? 'status-critical' :
                            (${plant.status} == 'Warning' ? 'status-warning' :
                            (${plant.status} == 'Healthy' ? 'status-optimal' : 'status-nodata')))">Healthy</span>
          </div>

          <div class="mt-6 grid grid-cols-3 gap-4">
            <div class="bg-gray-50 p-3 rounded-lg">
              <div class="text-xs text-gray-500">Moisture</div>
              <div class="text-sm font-semibold"
                   th:text="${#numbers.formatDecimal(plant.minOptimalMoisture,1,0) + '-' + #numbers.formatDecimal(plant.maxOptimalMoisture,1,0) + '%'}">0%</div>
            </div>
            <div class="bg-gray-50 p-3 rounded-lg">
              <div class="text-xs text-gray-500">Temperature</div>
              <div class="text-sm font-semibold"
                   th:text="${#numbers.formatDecimal(plant.minOptimalTemperature,1,0) + '-' + #numbers.formatDecimal(plant.maxOptimalTemperature,1,0) + '°C'}">0°C</div>
            </div>
            <div class="bg-gray-50 p-3 rounded-lg">
              <div class="text-xs text-gray-500">Humidity</div>
              <div class="text-sm font-semibold"
                   th:text="${#numbers.formatDecimal(plant.minOptimalHumidity,1,0) + '-' + #numbers.formatDecimal(plant.maxOptimalHumidity,1,0) + '%'}">0%</div>
            </div>
          </div>

          <p class="mt-4 text-sm text-gray-500">
            <span th:if="${plant.lastWatered != null}"
                  th:text="'Last watered: ' + ${#temporals.format(plant.lastWatered, 'MMM dd, yyyy')}"></span>
            <span th:if="${plant.lastWatered == null}">Never watered</span>
          </p>
        </div>

        <div class="px-4 py-3 bg-white border-t border-gray-200 flex justify-between items-center">
          <form th:action="@{/plant/water/{id}(id=${plant.id})}" method="post">
            <button type="submit" class="text-sm font-medium text-emerald-600 hover:text-emerald-500">Water now</button>
          </form>
          <a th:href="@{/plant/edit/{id}(id=${plant.id})}"
             class="text-sm font-medium text-indigo-600 hover:text-indigo-500">Edit</a>
          <form th:action="@{/plant/delete/{id}(id=${plant.id})}" method="post"
                onsubmit="return confirm('Delete this plant and all its sensor data and schedules?');">
            <button type="submit" class="text-sm font-medium text-red-600 hover:text-red-500">Delete</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
