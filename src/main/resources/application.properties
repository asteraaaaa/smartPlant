spring.application.name=smartPlant

spring.thymeleaf.cache=false

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# For Spring Boot 2.4+ add spring.jpa.defer-datasource-initialization=true
# in application.properties
spring.jpa.defer-datasource-initialization=true

# H2 Database Setting
spring.h2.console.enabled=true
#
#server.port=8080
#server.address=0.0.0.0

###
#   Hibernate Settings
#   ddl.auto = none | validate | update | create | create-drop
###
spring.jpa.hibernate.ddl-auto = create-drop
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.format_sql=true

###
#   Pump settings
#   mode = mock (default, safe for demos/GitHub) | http (real Arduino)
###
smartplant.pump.mode=mock
smartplant.pump.url=http://192.168.1.50/pump/on
smartplant.pump.timeout-ms=2000
smartplant.pump.duration-ms=5000
# minimum seconds between automatic waterings of the same plant
smartplant.pump.cooldown-seconds=300

spring.jpa.open-in-view=false

# keep the session id in a cookie only (no ;jsessionid=... appended to URLs after redirects)
server.servlet.session.tracking-modes=cookie

###
#   Demo helpers
###
# generates fake sensor readings for every plant (turn off when real sensors post data)
smartplant.simulator.enabled=true
smartplant.simulator.interval-ms=10000
# runs due watering schedules automatically
smartplant.scheduler.enabled=true
smartplant.scheduler.interval-ms=30000
